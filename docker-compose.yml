# AcademiaX: full stack. All values come from .env (copy .env.example to .env first).
#   docker compose up --build
# Two instances each of course-service and enrollment-service run on their own ports, so every
# response's X-Served-By header (course-service@8082 vs course-service@8092) proves load balancing.

x-service-env: &service-env
  DB_HOST: mysql
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  EUREKA_URL: http://eureka-server:8761/eureka/

x-healthcheck: &actuator-healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 40s

x-after-infra: &after-infra
  mysql:
    condition: service_healthy
  eureka-server:
    condition: service_healthy

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      # Host port only for inspecting the DB from Windows; services use mysql:3306 inside the network.
      - '${MYSQL_HOST_PORT:-3307}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka-server:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: eureka-server/Dockerfile
    ports:
      - '8761:8761'
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8761/actuator/health || exit 1"]
      <<: *actuator-healthcheck

  auth-service:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    ports:
      - '8081:8081'
    environment:
      <<: *service-env
      PORT: 8081
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
    depends_on: *after-infra
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || exit 1"]
      <<: *actuator-healthcheck

  course-service-1:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: course-service/Dockerfile
    ports:
      - '8082:8082'
    environment:
      <<: *service-env
      PORT: 8082
    depends_on: *after-infra
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health || exit 1"]
      <<: *actuator-healthcheck

  course-service-2:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: course-service/Dockerfile
    ports:
      - '8092:8092'
    environment:
      <<: *service-env
      PORT: 8092
      # Only one instance seeds demo data; both share the same MySQL schema.
      SEED_DATA: 'false'
    depends_on:
      <<: *after-infra
      course-service-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8092/actuator/health || exit 1"]
      <<: *actuator-healthcheck

  payment-service:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: payment-service/Dockerfile
    ports:
      - '8084:8084'
    environment:
      <<: *service-env
      PORT: 8084
    depends_on: *after-infra
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8084/actuator/health || exit 1"]
      <<: *actuator-healthcheck

  notification-service:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    ports:
      - '8085:8085'
    environment:
      <<: *service-env
      PORT: 8085
    depends_on: *after-infra
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8085/actuator/health || exit 1"]
      <<: *actuator-healthcheck

  enrollment-service-1:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: enrollment-service/Dockerfile
    ports:
      - '8083:8083'
    environment:
      <<: *service-env
      PORT: 8083
    depends_on:
      <<: *after-infra
      course-service-1:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/actuator/health || exit 1"]
      <<: *actuator-healthcheck

  enrollment-service-2:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: enrollment-service/Dockerfile
    ports:
      - '8093:8093'
    environment:
      <<: *service-env
      PORT: 8093
      SEED_DATA: 'false'
    depends_on:
      <<: *after-infra
      enrollment-service-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8093/actuator/health || exit 1"]
      <<: *actuator-healthcheck

  api-gateway:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    ports:
      - '8080:8080'
    environment:
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_URL: http://eureka-server:8761/eureka/
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      course-service-1:
        condition: service_healthy
      enrollment-service-1:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      <<: *actuator-healthcheck

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - '5173:80'
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  mysql_data:
