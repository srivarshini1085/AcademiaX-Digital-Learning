spring:
  datasource:
    url: jdbc:h2:mem:auth_test;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

jwt:
  secret: test-secret-key-for-unit-tests-must-be-32-bytes-long
  expiration: 900000
  refresh-expiration: 604800000

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

spring.cloud.discovery.enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

